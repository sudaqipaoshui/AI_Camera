# ============================================================
# 摄像头测试环境配置
#
# 凭据一律以 ${VAR} 占位符引用, 真实值放在项目根 .env (不入库)。
# 新增变量请同步更新 .env.example。
# 取值统一走 envloader, 例: from envloader import require
# ============================================================

refresh_token: 1

host:
  yuntiyu-test: https://yuntiyu-test.dream-sports.cn
  camera-prod: http://192.168.1.245
  # camera 由 config/devices.yaml 的 active 设备在运行时注入(覆盖此处的值),
  # 70 个数据文件用 {{$.host.camera}} 决定"测哪台设备"。
  # 这里保留一个占位值只为让配置自解释; 真正生效的是清单里的 IP。
  camera: http://192.168.2.60
  cameraA: http://192.168.3.29
  cameraB: http://192.168.3.30
  camera175: http://192.168.3.175
  replay: 192.168.2.123
  replay3: 192.168.3.63
  replay200: 192.168.3.200
  replay178: 192.168.3.178
  replay175: 192.168.3.176

url:
  host: https://yuntiyu-test.dream-sports.cn/

users:
- id: 1
  username: ${YUNTIYU_ACCOUNT_USERNAME}
  password: ${YUNTIYU_ACCOUNT_PASSWORD}
  encodePassword: ${YUNTIYU_ACCOUNT_ENCODE_PASSWORD}
  x_token: ${YUNTIYU_X_TOKEN}

licence: ${CAMERA_LICENCE}

# ---------- 设备身份: 不在这里写 ----------
# 设备 IP / SSH 账号统一由 config/devices.yaml 提供, 由 env fixture 在运行时合并进来,
# 因此 env['ssh_host'] / env['ssh_username'] / env['ssh_password'] 仍然照常用,
# 但值的来源只有一处。
#
# 历史问题: 这里曾硬编码 `ssh_host: 192.168.2.30`(早已离线的旧实验机),
# 导致 22 条真的去连设备的 API 用例必然失败。换设备请改 config/devices.yaml 的 active。
#
# X3 备用机同理, 在 devices.yaml 里切换即可, 不需要在这里切换注释。

# SSH 连接参数(非身份信息, 对所有设备通用, 因此留在环境配置里)
ssh_port: 22
ssh_timeout: 30

environment: test
proxy: false

# 说明: rootdir / config_path 由 pytest_helper/plugin.py 的 env fixture 在运行时
# 按实际路径注入, 写在配置里也会被覆盖, 因此不再保留 (原值是无效的 mac 路径)。
