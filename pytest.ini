[pytest]
# 从 API/pytest.ini 继承配置
addopts = -rsxX --color=yes --env=test --config=camera.yaml --alluredir allure-report/allure-results
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
enable_assertion_pass_hook = true
markers =
    datafile: parametrize tests with external data files
    author: 用例作者标记, 由 yapi 生成器写入, 例 @pytest.mark.author('pytest.generator')
    cool_marker: this one is for cool tests.
    mark_with: this marker takes arguments.
    slowme: marks tests as slow (deselect with '-m "not slow"')
    chaos: chaos server mark
    x5_ssh_24h_monitoring: X5摄像头24小时SSH监控测试
    longrunning: 长时间运行的测试
    manual: 手动执行的测试用例，默认跳过，使用 '-m manual' 运行
console_output_style = count

log_file_level = INFO
log_file = test_result.log
log_file_date_format = %Y-%m-%d %H:%M:%S
log_file_format = %(asctime)s [%(filename)s:%(lineno)d] %(levelname)s: %(message)s

log_cli = 1
log_cli_level = INFO
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_cli_format = %(asctime)s [%(filename)s:%(lineno)d] %(levelname)s: %(message)s

# 默认只跑"不需要真机"的接口类用例。E2E 实机用例(418个)刻意不放在这里:
# 它们依赖真机 + adb + airtest, 放进 testpaths 会让裸跑 pytest 直接失败。
# 需要时显式指定:  python -m pytest E2E/tests --env=test --config=camera.yaml
testpaths = 
    Stability
    Performance
    Benchmark
    Security
    API/tests

pythonpath = 
    .
    API

