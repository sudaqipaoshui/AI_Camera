common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/ChangeGlobalConfig
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/ChangeGlobalConfig｜uploadFaceLog=1
  input:
    json:
      uploadFaceLog: 1  # 可选，是否上传人脸日志
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜uploadFaceLog=0
  input:
    json:
      uploadFaceLog: 0  # 可选，是否上传人脸日志
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜enableDebug=1
  input:
    json:
      enableDebug: 1    # 可选，是否启用调试模式
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜enableDebug=0
  input:
    json:
      enableDebug: 0    # 可选，是否启用调试模式
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜standRecFace=1
  input:
    json:
      standRecFace: 1   # 可选，站立识别人脸
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜standRecFace=0
  input:
    json:
      standRecFace: 0   # 可选，站立识别人脸
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜all
  input:
    json:
      uploadFaceLog: 1  # 可选，是否上传人脸日志
      enableDebug: 1    # 可选，是否启用调试模式
      standRecFace: 1   # 可选，站立识别人脸
  expectation:
    response:
      code: 0

- case: /camera/ChangeGlobalConfig｜all=0
  input:
    json:
      uploadFaceLog: 0  # 可选，是否上传人脸日志
      enableDebug: 0    # 可选，是否启用调试模式
      standRecFace: 0   # 可选，站立识别人脸
  expectation:
    response:
      code: 0