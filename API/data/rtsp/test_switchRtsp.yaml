common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/switchRtsp
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/switchRtsp
  input:
    json:
      type: 1  # 1=启用，0=禁用
  expectation:
    response:
      code: 0

- case: /camera/switchRtsp
  input:
    json:
      type: 0  # 1=启用，0=禁用
  expectation:
    response:
      code: 0