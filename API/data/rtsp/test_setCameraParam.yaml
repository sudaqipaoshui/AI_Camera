common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/setCameraParam
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/setCameraParam
  input:
    json:
      type: 1                      # 2=查询，0/1=设置
      integrationTime: 800       # 积分时间（设置时必填）
      sensorAnalogGain: 64        # 传感器模拟增益（设置时必填）
  expectation:
    response:
      code: 0
      integrationTime: 800
      sensorAnalogGain: 64

- case: /camera/setCameraParam
  input:
    json:
      type: 1                      # 2=查询，0/1=设置
      integrationTime: 1000        # 积分时间（设置时必填）
      sensorAnalogGain: 128        # 传感器模拟增益（设置时必填）
  expectation:
    response:
      code: 0
      integrationTime: 1000
      sensorAnalogGain: 128