common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/ctrlMirror
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/ctrlMirror
  input:
    json:
      is_mirror: true
  expectation:
    response:
      code: 0
      is_mirror: true

- case: /camera/ctrlMirror
  input:
    json:
      is_mirror: false
  expectation:
    response:
      code: 0
      is_mirror: false