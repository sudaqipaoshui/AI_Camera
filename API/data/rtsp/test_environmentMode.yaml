common_inputs:
  host: '{{$.host.camera}}'
  method: GET
  path: /environmentMode?type={mode}
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /environmentMode?type=1 # 空=查询当前模式，0=室内模式，1=室外模式
  input:
    path: /camera/environmentMode?type=
  expectation:
    response:
      code: 0
      data: 0

- case: /environmentMode?type=0
  input:
    path: /camera/environmentMode?type=
  expectation:
    response:
      code: 0
      data: 0

- case: /environmentMode?type=1
  input:
    path: /camera/environmentMode?type=1
  expectation:
    response:
      code: 0
      data: 1