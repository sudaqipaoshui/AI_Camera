common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/gestureSwitch
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/gestureSwitch|open=0
  input:
    json:
      open: 1
  expectation:
    response:
      code: 0

- case: /camera/gestureSwitch|open=1
  input:
    json:
      open: 1
  expectation:
    response:
      code: 0