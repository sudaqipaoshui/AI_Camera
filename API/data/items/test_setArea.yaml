common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/setArea
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/setArea
  input:
    json:
      id: 17                             # 必填，项目ID
      area:                              # 可选，检测区域坐标
        - [0.1, 0.1]
        - [0.9, 0.9]
      device:                            # 可选，设备信息
        name: 设备001
        deviceInfo: device_unique_id
      endDistance: 100                   # 可选，结束距离
      cycleSize: 50                      # 可选，循环大小
      groupId: 1                         # 可选，分组ID
      cameraId: 1                        # 可选，摄像头ID
      type: 1                            # 可选，类型
      groundWidth: 200                   # 可选，场地宽度
      scoreDiff: 5                       # 可选，分数差异
      groundLength: 400                  # 可选，场地长度
      pointList: []                      # 可选，点位列表
      rectList: []                       # 可选，矩形列表
      endInitArea: []                    # 可选，结束初始区域
      host: https://callback.com/        # 可选，回调地址
      useFaceRec: 1                      # 可选，使用人脸识别
      poleStartIndex: 0                  # 可选，杆起始索引
      poleCount: 10                      # 可选，杆数量
      startIndex: 0                      # 可选，起始索引
      ballCheck: 1                       # 可选，球检测
      standArea:                         # 可选，站位区域
        - 0.1
        - 0.1
        - 0.9
        - 0.1
        - 0.9
        - 0.9
        - 0.1
        - 0.9
      realHeightForMarkingPoints: 180    # 可选，标记点实际高度
  expectation:
    response:
      code: 0