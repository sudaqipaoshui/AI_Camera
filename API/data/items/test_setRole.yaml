common_inputs:
  host: '{{$.host.camera}}'
  method: POST
  path: /camera/setRole
  params: {}
  headers:
    Content-Type: application/json
    x_token: '{{$.users[?(@.id==1)].x_token}}'
tests:
- case: /camera/setArea｜type=0
  input:
    json:
      id: 256                    # 项目ID
      type: 0                   # 0=主设备，1=从设备
      salveIp:                  # 可选，从设备IP
      salveType:                # 可选，从设备类型
  expectation:
    response:
      code: 0

- case: /camera/setArea｜type=10
  input:
    json:
      id: 256                    # 项目ID
      type: 10                   # 0=主设备，1=从设备
      salveIp:
      salveType:
  expectation:
    response:
      code: 0